[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rawi"
version = "0.1.0"
description = "Redonner vie aux bandes dessinées : planches → motion comic (100 % open source)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["embedkit", "numpy", "opencv-python-headless", "pypdfium2"]

[project.scripts]
rawi = "rawi.__main__:main"

[tool.setuptools]
packages = ["rawi"]
